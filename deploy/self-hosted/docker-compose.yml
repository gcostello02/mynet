# Deprecated path — use deploy/coordinator/docker-compose.yml
# Kept for compatibility; identical coordinator service definition.
name: mynet-coordinator

services:
  coordinator:
    image: mynet-coordinator:latest
    build:
      context: ../..
      dockerfile: deploy/coordinator/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYNET_SERVER_SECRET: ${MYNET_SERVER_SECRET:?Set MYNET_SERVER_SECRET in .env}
      MYNET_DATA_PATH: ${MYNET_DATA_PATH:-/data/coordinator.db}
      MYNET_LISTEN: ${MYNET_LISTEN:-:8080}
      MYNET_SECURE_COOKIES: ${MYNET_SECURE_COOKIES:-true}
      MYNET_VPN_CIDR: ${MYNET_VPN_CIDR:-172.31.240.0/20}
      MYNET_STUN_URLS: ${MYNET_STUN_URLS:-}
      MYNET_TURN_URLS: ${MYNET_TURN_URLS:-}
      MYNET_TURN_SECRET: ${MYNET_TURN_SECRET:-}
    volumes:
      - coordinator-data:/data
    ports:
      - "127.0.0.1:${MYNET_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  coordinator-data:
