name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - name: Install, typecheck, test and build the admin UI
        run: cd web/admin && npm ci && npm run typecheck && npm test && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: internal/dashboard/dist

  go:
    name: go (fmt, vet, test)
    runs-on: ubuntu-latest
    needs: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: internal/dashboard/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test ./... -race -count=1

  linux-cross-compile:
    name: linux-cross-compile (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: dashboard
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: internal/dashboard/dist
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build mynet (linux/${{ matrix.goarch }})
        run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/mynet ./cmd/mynet
      - name: Build mynet-server (linux/${{ matrix.goarch }})
        run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/mynet-server ./cmd/mynet-server
      - name: Linux netprobe tests
        # The runner is amd64: run the tests natively there, and only compile
        # them for arm64 (executing an arm64 binary would fail with "exec format error").
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test ./internal/netprobe -count=1
          else
            GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /dev/null ./internal/netprobe
          fi
