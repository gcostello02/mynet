name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test -race ./... -count=1

  linux-cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build mynet (linux/${{ matrix.goarch }})
        run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/mynet ./cmd/mynet
      - name: Build mynet-server (linux/${{ matrix.goarch }})
        run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/mynet-server ./cmd/mynet-server
      - name: Linux netprobe tests
        run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go test ./internal/netprobe -count=1
